<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .todo-item { margin: 8px 0; display: flex; gap: 10px; align-items: center; }
        button { cursor: pointer; }
    </style>
</head>
<body>
    <h2>Daftar Tugas (Todo List)</h2>
    <form id="todo-form">
        <input id="todo-input" placeholder="Tulis tugas baru..." required>
        <button type="submit">Kirim</button>
    </form>
    <ul id="todo-list"></ul>

    <script src="todo.js"></script>
</body>
</html>
